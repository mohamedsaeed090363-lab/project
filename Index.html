<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <div>
                <h1>آلة حاسبة ذكية</h1>
                <p>Smart Calculator</p>
            </div>

            <button id="themeBtn">🌙</button>
        </header>

        <main class="calculator">

            <div class="display">
                <div id="previous"></div>

                <div class="result-row">
                    <input
                        type="text"
                        id="display"
                        value="0"
                        readonly
                    >

                    <button id="copyBtn">📋</button>
                </div>
            </div>

            <div class="scientific">

                <button data-value="sin(">sin</button>
                <button data-value="cos(">cos</button>
                <button data-value="tan(">tan</button>
                <button data-value="sqrt(">√</button>

                <button data-value="log(">log</button>
                <button data-value="ln(">ln</button>
                <button data-value="π">π</button>
                <button data-value="^">xʸ</button>

            </div>

            <div class="buttons">

                <button class="danger" data-action="clear">AC</button>
                <button data-action="delete">⌫</button>
                <button data-value="%">%</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button data-value="(">(</button>
                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equal" data-action="calculate">=</button>

            </div>

        </main>

        <section class="history">

            <div class="history-header">
                <h2>سجل العمليات</h2>

                <button id="clearHistory">
                    مسح السجل
                </button>
            </div>

            <div id="historyList">
                <p class="empty">لا توجد عمليات حتى الآن</p>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
